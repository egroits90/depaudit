[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "egroits90-depaudit"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出依赖的许可审计上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "egroits90" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://egroits90.github.io"
Repository = "https://github.com/egroits90/depaudit"
Issues = "https://github.com/egroits90/depaudit/issues"

[project.scripts]
depaudit = "depaudit:main"

[tool.setuptools]
py-modules = ["depaudit"]
